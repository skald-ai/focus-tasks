<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta
      name="description"
      content="Фокус — список дел на день. Работает в браузере, задачи хранятся на вашем устройстве"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Фокус — список дел на день</title>
    <script>
      // Тема выставляется до первой отрисовки, чтобы страница не мигала светлым фоном
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('focus-tasks:theme')
        } catch (e) {
          theme = null
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161513')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
